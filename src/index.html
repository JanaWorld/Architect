<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Design Tokens / Basic Setup */
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --success-color: #10b981;
            --radius: 8px;
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.5;
            padding: 2rem;
        }
        
        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 2rem;
        }
        
        @media (max-width: 768px) {
            .container { grid-template-columns: 1fr; }
        }
        
        .card {
            background: var(--surface-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2rem;
            margin-bottom: 1.5rem;
        }
        
        h1, h2, h3 { color: var(--text-main); margin-bottom: 1rem; }
        h1 { font-size: 1.75rem; font-weight: 700; }
        h2 { font-size: 1.25rem; font-weight: 600; border-bottom: 1px solid var(--border-color); padding-bottom: 0.5rem; }
        
        .question-card {
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 1.5rem;
            margin-bottom: 1rem;
            transition: border-color 0.2s;
        }
        .question-card:focus-within { border-color: var(--primary-color); }
        
        .q-title { font-weight: 600; margin-bottom: 0.5rem; font-size: 1.1rem; }
        .q-desc { color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1rem; }
        
        .options { display: flex; flex-direction: column; gap: 0.5rem; }
        .option-label {
            display: flex; align-items: center; gap: 0.5rem;
            padding: 0.75rem; border: 1px solid var(--border-color);
            border-radius: var(--radius); cursor: pointer;
            transition: background-color 0.2s;
        }
        .option-label:hover { background-color: var(--bg-color); }
        
        input[type="text"], input[type="number"], select, textarea {
            width: 100%; padding: 0.75rem;
            border: 1px solid var(--border-color); border-radius: var(--radius);
            font-size: 1rem;
        }
        
        button {
            background: var(--primary-color); color: white;
            border: none; padding: 0.75rem 1.5rem; border-radius: var(--radius);
            font-weight: 500; cursor: pointer; transition: background 0.2s;
        }
        button:hover { background: var(--primary-hover); }
        button:disabled { background: var(--text-muted); cursor: not-allowed; }
        
        .sidebar { font-size: 0.9rem; }
        .stat-row { display: flex; justify-content: space-between; margin-bottom: 0.5rem; padding-bottom: 0.5rem; border-bottom: 1px dashed var(--border-color); }
        .stat-val { font-weight: 600; }
        
        .loading { text-align: center; padding: 2rem; color: var(--text-muted); font-style: italic; }
        
        .tag {
            display: inline-block; padding: 0.25rem 0.5rem;
            background: var(--bg-color); border: 1px solid var(--border-color);
            border-radius: 4px; font-size: 0.8rem; margin: 0.2rem;
        }
    </style>
  </head>
  <body>
    <div id="app">
        <div class="loading">Loading ProjectScope...</div>
    </div>

    <!-- UI Template -->
    <template id="app-template">
        <div class="container">
            <!-- Main Content Area: Questions -->
            <div class="main-content">
                <div class="card">
                    <h1>Project Discovery</h1>
                    <p style="color: var(--text-muted); margin-bottom: 2rem;">Answer the following questions to help us structure your project.</p>
                    
                    <div id="questions-container"></div>
                </div>
            </div>
            
            <!-- Sidebar Area: Real-time Analysis -->
            <div class="sidebar">
                <div class="card">
                    <h2>Live Architecture</h2>
                    <div id="analysis-content">
                        <!-- Populated dynamically -->
                    </div>
                </div>
            </div>
        </div>
    </template>

    <script>
        // Frontend Application Logic
        let state = {
            projectId: localStorage.getItem('projectScopeId'),
            data: null
        };

        function init() {
            renderLoading();
            google.script.run
                .withSuccessHandler(onStateLoaded)
                .withFailureHandler(onError)
                .getProjectState(state.projectId);
        }

        function onStateLoaded(serverState) {
            console.log("State loaded:", serverState);
            state.data = serverState;
            
            // Save project ID
            if (!state.projectId) {
                state.projectId = serverState.project.id;
                localStorage.setItem('projectScopeId', state.projectId);
            }
            
            render();
        }

        function onError(err) {
            console.error(err);
            document.getElementById('app').innerHTML = `<div class="card" style="color: red;">Error: ${err.message}</div>`;
        }

        function submitAnswer(questionId) {
            // Get value based on input type
            const formContainer = document.getElementById(`q-${questionId}`);
            if(!formContainer) return;

            let value = null;
            const inputs = formContainer.querySelectorAll('input, select, textarea');
            
            if (inputs.length === 1) {
                const input = inputs[0];
                if (input.type === 'radio' || input.type === 'checkbox') {
                    const checked = formContainer.querySelector('input:checked');
                    if (checked) value = checked.value;
                } else {
                    value = input.value;
                }
            } else if (inputs.length > 1 && inputs[0].type === 'radio') {
                const checked = formContainer.querySelector('input[type="radio"]:checked');
                if (checked) value = checked.value;
            }

            if (!value) return; // simple validation

            // Disable UI while submitting
            const btn = formContainer.querySelector('button');
            btn.disabled = true;
            btn.innerText = 'Saving...';

            google.script.run
                .withSuccessHandler(onStateLoaded)
                .withFailureHandler(onError)
                .submitAnswer(state.projectId, questionId, value);
        }

        function renderLoading() {
            document.getElementById('app').innerHTML = '<div class="loading">Loading ProjectScope Engine...</div>';
        }

        function render() {
            const app = document.getElementById('app');
            const template = document.getElementById('app-template');
            app.innerHTML = '';
            app.appendChild(template.content.cloneNode(true));
            
            renderQuestions();
            renderAnalysis();
        }

        function renderQuestions() {
            const container = document.getElementById('questions-container');
            if (!state.data.nextQuestions || state.data.nextQuestions.length === 0) {
                container.innerHTML = '<div class="card"><h3>Discovery Complete!</h3><p>We have gathered enough information to propose an architecture.</p><button onclick="localStorage.removeItem(\'projectScopeId\'); location.reload();">Start New Project</button></div>';
                return;
            }

            state.data.nextQuestions.forEach(q => {
                const qHtml = `
                    <div class="question-card" id="q-${q.id}">
                        <div class="q-title">${q.text}</div>
                        ${q.description ? `<div class="q-desc">${q.description}</div>` : ''}
                        <div class="options" style="margin-bottom: 1rem;">
                            ${renderInputForQuestion(q)}
                        </div>
                        <button onclick="submitAnswer('${q.id}')">Continue</button>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', qHtml);
            });
        }

        function renderInputForQuestion(q) {
            if (q.type === 'single') {
                return q.options.map(opt => `
                    <label class="option-label">
                        <input type="radio" name="${q.id}" value="${opt.value}">
                        <span>${opt.label}</span>
                    </label>
                `).join('');
            } else if (q.type === 'text') {
                return `<input type="text" name="${q.id}" placeholder="Enter your answer...">`;
            } else if (q.type === 'longtext') {
                return `<textarea name="${q.id}" rows="3" placeholder="Enter your answer..."></textarea>`;
            } else if (q.type === 'number') {
                return `<input type="number" name="${q.id}" placeholder="Enter number...">`;
            }
            return '<div>Unsupported question type</div>';
        }

        function renderAnalysis() {
            const container = document.getElementById('analysis-content');
            const { architecture, requirements, facts, answers } = state.data;
            
            let html = `
                <div class="stat-row">
                    <span>Questions Answered</span>
                    <span class="stat-val">${answers ? answers.length : 0}</span>
                </div>
                <div class="stat-row">
                    <span>Facts Extracted</span>
                    <span class="stat-val">${facts ? Object.keys(facts).length : 0}</span>
                </div>
                <div class="stat-row">
                    <span>Requirements Drafted</span>
                    <span class="stat-val">${requirements ? requirements.length : 0}</span>
                </div>
            `;
            
            if (architecture && architecture.patterns && architecture.patterns.length > 0) {
                html += `
                    <h3 style="margin-top: 1.5rem; font-size: 1rem;">Top Architecture Pattern</h3>
                    <div class="tag" style="background: var(--success-color); color: white; border:none; margin:0;">
                        ${architecture.patterns[0].pattern}
                    </div>
                `;
            }
            
            if (architecture && architecture.recommendedTechStack) {
                html += `<h3 style="margin-top: 1.5rem; font-size: 1rem;">Predicted Stack</h3>`;
                const stack = architecture.recommendedTechStack;
                if(stack.frontend.length) html += `<div style="font-size: 0.85rem; margin-top: 0.5rem;"><b>Frontend:</b> ${stack.frontend[0].name}</div>`;
                if(stack.backend.length) html += `<div style="font-size: 0.85rem; margin-top: 0.5rem;"><b>Backend:</b> ${stack.backend[0].name}</div>`;
                if(stack.database.length) html += `<div style="font-size: 0.85rem; margin-top: 0.5rem;"><b>Database:</b> ${stack.database[0].name}</div>`;
            }

            container.innerHTML = html;
        }

        // Start
        window.addEventListener('load', init);
    </script>
  </body>
</html>
